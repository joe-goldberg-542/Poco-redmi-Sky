name: kernel Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: debug the pipeline
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: enable LTO optimization
        default: "full"
        type: choice
        options:
          - "none"
          - "thin"
          - "full"

      BUILD_VANILLA:
        description: "Build Vanilla (no KSU)"
        type: boolean
        default: false

      BUILD_KSU:
        description: "Build with KernelSU"
        type: boolean
        default: false

      BUILD_FINASU:
        description: "Build with FinaSU (Dev) + SUSFS"
        type: boolean
        default: true

      DROIDSPACES:
        description: "Enable droidspaces-oss support"
        type: boolean
        default: false

      NH:
        description: "Enable NetHunter support"
        type: boolean
        default: false

      NM:
        description: "Enable NoMount support"
        type: boolean
        default: true

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Generate build matrix
        id: set-matrix
        env:
          KERNEL_VERSION: "6.6"
          BUILD_VANILLA: ${{ github.event.inputs.BUILD_VANILLA }}
          BUILD_KSU: ${{ github.event.inputs.BUILD_KSU }}
          BUILD_FINASU: ${{ github.event.inputs.BUILD_FINASU }}
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev gh bc bison flex libssl-dev libelf-dev cmake zlib1g-dev cpio zip
          pip install lxml

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: "6.6"
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: ${{ matrix.No_DS }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NH: ${{ inputs.NH }}
          NM: ${{ inputs.NM }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Repack and Sign Boot Image
        if: github.event.inputs.TODO != 'defconfig' && github.event.inputs.TEST == 'no'
        env:
          BOOT_IMG_URL: "https://www.dropbox.com/scl/fi/lz88o798gu5ae9tolprfu/Aospaboot.img?rlkey=lz4jq3olbv7riqrvixd0qq0w3&st=7ear88p0&dl=1"
        shell: bash
        run: |
          echo "::group::[*] Repacking and Signing Boot Image"
          mkdir -p repack/extracted
          mkdir -p repack/output

          git clone -q --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg repack/mkbootimg_tool
          git clone -q --depth=1 https://android.googlesource.com/platform/external/avb repack/avb_tool

          curl -L "$BOOT_IMG_URL" -o repack/stock_boot.img

          PARTITION_SIZE=$(stat -c %s "repack/stock_boot.img")
          if [ "$PARTITION_SIZE" -lt 15000000 ]; then
             echo "::error::Corrupt boot image downloaded (Size: $PARTITION_SIZE bytes)."
             exit 1
          fi

          export IMAGE_PATH="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
             echo "::error::Compiled kernel Image does not exist at $IMAGE_PATH"
             exit 1
          fi

          python3 repack/mkbootimg_tool/unpack_bootimg.py --boot_img repack/stock_boot.img --out repack/extracted > repack/extracted/configs.txt

          python3 - << 'EOF'
          import sys, os, subprocess

          config = {}
          with open("repack/extracted/configs.txt") as f:
              for line in f:
                  if ":" in line:
                      key, val = line.split(":", 1)
                      config[key.strip().lower().replace("_", " ")] = val.strip()

          header_version = config.get("boot image header version") or config.get("header version") or "4"
          page_size = config.get("page size") or "4096"
          cmdline = config.get("command line args") or config.get("command line") or config.get("cmdline") or ""
          board_name = config.get("name") or config.get("board name") or config.get("board") or ""
          os_version = config.get("os version") or ""
          os_patch_level = config.get("os patch level") or ""

          cmd = [
              "python3", "repack/mkbootimg_tool/mkbootimg.py",
              "--kernel", os.environ.get("IMAGE_PATH"),
              "--header_version", str(header_version),
              "--pagesize", str(page_size),
              "--output", "repack/output/boot.img"
          ]

          if cmdline: cmd.extend(["--cmdline", cmdline])
          if board_name: cmd.extend(["--board", board_name])
          if os_version and os_version != "None": cmd.extend(["--os_version", os_version])
          if os_patch_level and os_patch_level != "None": cmd.extend(["--os_patch_level", os_patch_level])

          if os.path.exists("repack/extracted/ramdisk"): cmd.extend(["--ramdisk", "repack/extracted/ramdisk"])
          if os.path.exists("repack/extracted/dtb"): cmd.extend(["--dtb", "repack/extracted/dtb"])
          if os.path.exists("repack/extracted/dtbo"): cmd.extend(["--dtbo", "repack/extracted/dtbo"])

          res = subprocess.run(cmd)
          if res.returncode != 0:
              print("::error::mkbootimg repack failed.")
              sys.exit(1)
          EOF

          if [ ! -f "repack/output/boot.img" ]; then
             echo "::error::Repacked boot image not found."
             exit 1
          fi

          python3 repack/avb_tool/avbtool.py add_hash_footer \
            --image "repack/output/boot.img" \
            --partition_name boot \
            --partition_size "$PARTITION_SIZE" \
            --key "repack/avb_tool/test/data/testkey_rsa2048.pem" \
            --algorithm SHA256_RSA2048

          BOOT_IMG_NAME="GKID-${VARIANT}-${RELEASE}-${LINUX_VERSION}-boot.img"
          cp repack/output/boot.img "artifacts/$BOOT_IMG_NAME"
          echo "::endgroup::"

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ github.repository }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
            mkdir -p rejected-patches-${{ matrix.name }}
            find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
            echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: downloaded-artifacts
          pattern: build-*
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/*.txt
            downloaded-artifacts/*.zip
            downloaded-artifacts/*.img
            downloaded-artifacts/*.apk
            downloaded-artifacts/*.log

  release:
    needs: build
    if: success() && github.event.inputs.TODO != 'defconfig' && github.event.inputs.TEST == 'no'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download build and env artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-artifacts
          pattern: build-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          shopt -s nullglob
          files=(*.zip *.img *.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .zip, .apk or .img files found to checksum!"
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt
          md5sum "${files[@]}" > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DROIDSPACES }}
          NH_INPUT: ${{ inputs.NH }}
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          body_path: release-body.md
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/*.img
            release-artifacts/*.apk
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
